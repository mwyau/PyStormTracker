name: Python Publish

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the CI artifact containing tested distributions
        required: true
        type: string
      repository:
        description: Package repository to publish to
        required: true
        type: string
      version:
        description: Package version to publish
        required: true
        type: string

concurrency:
  group: python-publish-${{ inputs.repository }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Publish to PyPI
    if: inputs.repository == 'pypi'
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/project/PyStormTracker/${{ inputs.version }}
    steps:
      - name: Retrieve tested distributions
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  test-pypi-publish:
    name: Publish to TestPyPI
    if: inputs.repository == 'testpypi'
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      attestations: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/PyStormTracker/${{ inputs.version }}
    steps:
      - name: Retrieve tested distributions
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
