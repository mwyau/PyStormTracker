version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      time: '04:00'
      timezone: America/New_York
    groups:
      python-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
      time: '04:10'
      timezone: America/New_York

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '04:15'
      timezone: America/New_York
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: '04:30'
      timezone: America/New_York
