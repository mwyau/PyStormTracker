# Codecov configuration
# This config enforces an overall project coverage floor while leaving patch
# coverage status disabled.

codecov:
  notify:
    after_n_builds: 5

coverage:
  status:
    project:
      default:
        target: 70%
    patch: off

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  after_n_builds: 5
