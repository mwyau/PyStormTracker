<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PyStormTracker WebGL Explorer</title>
    <link rel="stylesheet" href="explorer.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css"
    />
  </head>
  <body>
    <main>
      <div class="title-bar">
        <h1>Storm Track Explorer</h1>
        <span>PyStormTracker</span>
      </div>
      <div id="loading" class="message">Loading TrackJSON data…</div>
      <div id="error" class="message error" hidden></div>

      <section id="controls" class="controls" aria-label="Explorer controls" hidden>
        <label>
          Map projection
          <select id="projection">
            <option value="globe">Globe (3D)</option>
            <option value="mercator">Global (Lat/Lon)</option>
          </select>
        </label>
        <label>
          <span id="strength-label">Peak strength</span>
          <input id="strength" type="range" />
          <output id="strength-value"></output>
        </label>
        <label>
          Minimum duration
          <input id="duration" type="range" min="0" step="6" />
          <output id="duration-value"></output>
        </label>
        <label>
          Minimum displacement
          <input id="displacement" type="range" min="0" step="100" />
          <output id="displacement-value"></output>
        </label>
        <fieldset class="time-controls">
          <legend>Time range</legend>
          <div class="time-sliders">
            <input id="time-start" type="range" aria-label="Time range start" />
            <input id="time-end" type="range" aria-label="Time range end" />
            <input id="time-scrub" type="range" aria-label="Playback time" />
          </div>
          <div class="time-values">
            <output id="time-start-value"></output>
            <output id="time-current-value"></output>
            <output id="time-end-value"></output>
          </div>
          <div class="playback">
            <button id="play-pause" type="button">Play</button>
            <label><input id="loop" type="checkbox" /> Loop</label>
            <button id="speed-down" type="button" aria-label="Decrease playback speed">−</button>
            <output id="speed">1×</output>
            <button id="speed-up" type="button" aria-label="Increase playback speed">+</button>
            <label><input id="same-color" type="checkbox" /> Same color per track</label>
            <button id="reset" type="button">Reset</button>
          </div>
        </fieldset>
      </section>

      <section class="map-shell" aria-label="Storm track map">
        <aside id="legend" aria-label="Primary-variable color legend">
          <span id="legend-high"></span>
          <div class="color-bar"></div>
          <span id="legend-low"></span>
          <small id="legend-unit"></small>
        </aside>
        <div id="map"></div>
        <output id="diagnostics" aria-live="polite">FPS: --</output>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.12/dist.min.js"></script>
    <script src="explorer.js"></script>
  </body>
</html>
