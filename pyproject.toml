[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "PyStormTracker"
version = "0.6.1.dev2"
description = "A High-Performance Cyclone Tracker in Python"
readme = "README.md"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
authors = [
    { name = "Albert M. W. Yau", email = "albert@mwyau.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "dask>=2024.1.0",
    "cftime>=1.6.5",
    "ducc0>=0.39.0",
    "h5netcdf[h5py]>=1.8.0",
    "msgspec>=0.20.0",
    "numba>=0.63.0",
    "numpy>=2.3.3",
    "scipy>=1.16.1",
    "xarray>=2024.9.0",
]

[project.scripts]
stormtracker = "pystormtracker.cli:main"

[project.urls]
Homepage = "https://pystormtracker.readthedocs.io/"
Repository = "https://github.com/mwyau/PyStormTracker.git"
Issues = "https://github.com/mwyau/PyStormTracker/issues"

[project.optional-dependencies]
eof = [
    "xeofs[etc]>=3.0.3",
]
grib = [
    "cfgrib>=0.9.15.1",
    "eccodes>=2.46.0",
    "eccodeslib>=2.46.0; sys_platform != 'win32'",
]
mpi = [
    "mpi4py>=4.1.0",
]
netcdf4 = [
    "netCDF4>=1.7.2",
]
zarr = [
    "zarr[remote]>=3.0",
    "fsspec[http]>=2024.9.0",
]
all = [
    "PyStormTracker[eof,grib,mpi,netcdf4,zarr]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pystormtracker"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/benchmark/**",
    "/tests/data/era5/**",
]

[tool.check-manifest]
ignore = [
    "benchmark/**",
    "tests/data/**",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "test" },
    "identify>=2.6.19",
    "mypy>=2.3.0",
    "prek>=0.4.12",
    "ruff>=0.16.1",
    "ty==0.0.70",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
]
test = [
    "cdsapi>=0.7.7",
    "jsonschema>=4.26.0",
    "openmpi>=5.0.10 ; sys_platform != 'win32'",
    "pooch>=1.9.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-jsonschema>=4.26.0.20260518",
]
viz = [
    "cartopy>=0.25.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.11.1",
    "pandas>=3.0.1",
]

[tool.ruff]
force-exclude = true
extend-exclude = [
    "worktrees",
]

[tool.ruff.lint]
extend-select = ["ANN","B","C4","E","F","I","NPY","PT","SIM","UP","W"]
ignore = ["DTZ"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "ducc0",
    ]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = [
    "cftime",
    "ducc0",
    "matplotlib", "matplotlib.*",
    "mpi4py", "mpi4py.*",
    "pooch",
    "scipy", "scipy.*",
    "xeofs", "xeofs.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [ "dask", "dask.*" ]
ignore_missing_imports = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "zarr", "zarr.*"
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest]
addopts = [ "-ra -q" ]
testpaths = ["tests"]
markers = [
    "integration: tests requiring test data or optional backends",
]
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.coverage.run]
source = ["pystormtracker"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
]
