[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PyStormTracker"
version = "0.6.1.dev0"
description = "A High-Performance Cyclone Tracker in Python"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
authors = [
    { name = "Albert M. W. Yau", email = "albert@mwyau.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "dask>=2024.1.0",
    "cftime>=1.6.5",
    "ducc0>=0.39.0",
    "h5netcdf[h5py]>=1.8.0",
    "msgspec>=0.20.0",
    "numba>=0.63.0",  # numba 0.63 added support for Python 3.14 wheels
    "numpy>=2.3.3",
    "scipy>=1.16.1",
    "xarray>=2024.9.0",
]

[project.scripts]
stormtracker = "pystormtracker.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/PyStormTracker/"
Repository = "https://github.com/mwyau/PyStormTracker.git"
Issues = "https://github.com/mwyau/PyStormTracker/issues"

[project.optional-dependencies]
eof = [
    "xeofs[etc]>=3.0.3",
]
grib = [
    "cfgrib>=0.9.15.1",
    "eccodes>=2.46.0",
    "eccodeslib>=2.46.0; sys_platform != 'win32'",
]
mpi = [
    "mpi4py>=4.1.0",
]
netcdf4 = [
    "netCDF4>=1.7.2",
]
zarr = [
    "zarr[remote]>=3.0",
    "fsspec[http]>=2024.9.0",
]
all = [
    "PyStormTracker[eof,grib,mpi,netcdf4,zarr]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pystormtracker"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/benchmark",
    "/notebooks",
    "/tests/data",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "test" },
    "mypy>=2.3.0",
    "ruff>=0.16.1",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
]
test = [
    "cdsapi>=0.7.7",
    "jsonschema>=4.26.0",
    "openmpi>=5.0.10 ; sys_platform != 'win32'",
    "pooch>=1.9.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-jsonschema>=4.26.0.20260518",
]
viz = [
    "cartopy>=0.25.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.11.1",
    "pandas>=3.0.1",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv", "benchmark", "notebooks", "worktrees"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C4", "B", "UP", "PT", "SIM", "RUF", "ANN",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_decorators = false
exclude = [".venv", "notebooks", "benchmark", "docs", "worktrees"]
mypy_path = "src:tests"

[[tool.mypy.overrides]]
module = [
    "cftime",
    "ducc0",
    "dask.*",
    "mpi4py.*",
    "numba.*",
    "scipy.*",
    "xeofs.*",
    "zarr.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --durations=0"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.coverage.run]
source = ["pystormtracker"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.paths]
source = [
    "src/pystormtracker",
    "**/site-packages/pystormtracker",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "if __name__ == .__main__.:",
]

[tool.uv]
link-mode = "copy"
